<html xml:lang="{$lang->settings['htmllang']}" lang="{$lang->settings['htmllang']}" xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>{$mybb->settings['bbname']} - {$lang->drafts}</title>
{$headerinclude}
</head>
<body>
{$header}
<table width="100%" border="0" align="center">
<tr>
{$usercpnav}
<td valign="top">
	<form action="usercp.php" method="post">
		<input type="hidden" name="my_post_key" value="{$mybb->post_code}" />
		<table border="0" cellspacing="0" cellpadding="0" class="tborder ucp-table">
			<tr>
				<td class="thead" colspan="4"><strong>{$lang->drafts_count}</strong></td>
			</tr>
			<tr>
				<td class="tcat">{$lang->draft_title}</td>
				<td class="tcat">{$lang->draft_saved}</td>
				<td class="tcat ucp-num">{$lang->draft_options}</td>
				<td class="tcat ucp-check"><input type="checkbox" name="allbox" class="checkbox checkall mod-check" /></td>
			</tr>
			{$drafts}
		</table>
		<div class="ucp-submit">
			<input type="hidden" name="action" value="do_drafts" />
			<input type="submit" class="btn btn-light" name="draftman" value="{$lang->delete_drafts}" {$disable_delete_drafts} />
		</div>
	</form>
</td>
</tr>
</table>
{$footer}
</body>
</html>
