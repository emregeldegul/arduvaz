<div class="poll-result">
	<div class="poll-result-head">
		<span class="poll-result-option scaleimages">{$option}<span class="poll-mine">{$votestar}</span></span>
		<span class="poll-result-count">{$votes} · <strong>{$percent}%</strong></span>
	</div>
	<div class="poll-track"><div class="pollbar" style="width: {$imagewidth}%" title="{$percent}%"></div></div>
	<div class="poll-voters">{$userlist}</div>
</div>
