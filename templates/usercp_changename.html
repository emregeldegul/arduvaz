<html xml:lang="{$lang->settings['htmllang']}" lang="{$lang->settings['htmllang']}" xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>{$mybb->settings['bbname']} - {$lang->change_username}</title>
{$headerinclude}
</head>
<body>
{$header}
<form action="usercp.php" method="post">
<input type="hidden" name="my_post_key" value="{$mybb->post_code}" />
<table width="100%" border="0" align="center">
<tr>
{$usercpnav}
<td valign="top">
	{$errors}
	<section class="panel">
		<header class="panel-head"><svg><use href="{$theme['imgdir']}/icons.svg#i-edit"/></svg><h1>{$lang->change_username}</h1></header>
		<div class="form-rows">
			<div class="form-group-title">{$lang->password_confirmation}</div>
			<div class="form-row">
				<label class="form-label" for="password">{$lang->current_password}</label>
				<div class="form-field"><input type="password" class="textbox" name="password" id="password" autocomplete="current-password" /></div>
			</div>
			<div class="form-group-title">{$lang->change_username}</div>
			<div class="form-row">
				<label class="form-label" for="username">{$lang->new_username}</label>
				<div class="form-field"><input type="text" class="textbox" name="username" id="username" maxlength="{$mybb->settings['maxnamelength']}" value="{$username}" /></div>
			</div>
		</div>
	</section>
	<div class="ucp-submit">
		<input type="hidden" name="action" value="do_changename" />
		<input type="submit" class="btn btn-dark" name="submit" value="{$lang->update_username}" />
	</div>
</td>
</tr>
</table>
</form>
{$footer}
</body>
</html>
