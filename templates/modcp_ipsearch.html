<html xml:lang="{$lang->settings['htmllang']}" lang="{$lang->settings['htmllang']}" xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>{$mybb->settings['bbname']} - {$lang->ipsearch}</title>
{$headerinclude}
</head>
<body>
{$header}
<table width="100%" border="0" align="center">
<tr>
{$modcp_nav}
<td valign="top">
	<form action="modcp.php?action=ipsearch" method="post" class="panel mcp-filter mcp-ipsearch">
		<header class="panel-head"><svg><use href="{$theme['imgdir']}/icons.svg#i-globe"/></svg><h2>{$lang->ipaddress_search}</h2></header>
		<div class="form-rows mcp-filter-grid">
			<div class="form-row">
				<label class="form-label" for="ipaddress">{$lang->ip_address}</label>
				<div class="form-field"><input type="text" class="textbox" name="ipaddress" id="ipaddress" value="{$ipaddressvalue}" size="30" spellcheck="false" /></div>
			</div>
			<div class="form-row">
				<span class="form-label">{$lang->options}</span>
				<div class="form-field form-checks form-checks-inline">
					<label class="check"><input type="checkbox" class="checkbox" name="search_users" value="1" {$usersearchselect} /> {$lang->search_users}</label>
					<label class="check"><input type="checkbox" class="checkbox" name="search_posts" value="1" {$postsearchselect} /> {$lang->search_posts}</label>
				</div>
			</div>
		</div>
		<div class="ucp-actions">
			<input type="submit" class="btn btn-dark btn-sm" value="{$lang->find}" />
		</div>
	</form>
	{$ipsearch_results}
</td>
</tr>
</table>
{$footer}
</body>
</html>
