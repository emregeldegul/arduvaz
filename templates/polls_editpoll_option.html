<div class="poll-form-option">
	<span class="poll-form-num">{$counter}</span>
	<input type="text" class="textbox" name="options[{$counter}]" value="{$option}" aria-label="{$lang->option} {$counter}" />
	<label class="poll-form-votes">{$lang->votes} <input type="number" class="textbox form-num" name="votes[{$counter}]" min="0" value="{$optionvotes}" /></label>
</div>
