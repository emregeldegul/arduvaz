<html xml:lang="{$lang->settings['htmllang']}" lang="{$lang->settings['htmllang']}" xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>{$mybb->settings['bbname']} - {$lang->warning_logs}</title>
{$headerinclude}
</head>
<body>
{$header}
<table width="100%" border="0" align="center">
<tr>
{$modcp_nav}
<td valign="top">
	<form action="modcp.php" method="get" class="panel mcp-filter">
		<input type="hidden" name="action" value="warninglogs" />
		<header class="panel-head"><svg><use href="{$theme['imgdir']}/icons.svg#i-search"/></svg><h2>{$lang->filter_warning_logs}</h2></header>
		<div class="form-rows mcp-filter-grid">
			<div class="form-row">
				<label class="form-label" for="username">{$lang->filter_warned_user}</label>
				<div class="form-field"><input type="text" name="filter[username]" id="username" value="{$filter_username}" class="textbox" /></div>
			</div>
			<div class="form-row">
				<label class="form-label" for="mcp_modusername">{$lang->filter_issued_by}</label>
				<div class="form-field"><input type="text" name="filter[mod_username]" id="mcp_modusername" value="{$filter_modusername}" class="textbox" /></div>
			</div>
			<div class="form-row">
				<label class="form-label" for="mcp_reason">{$lang->filter_reason}</label>
				<div class="form-field"><input type="text" name="filter[reason]" id="mcp_reason" value="{$filter_reason}" class="textbox" /></div>
			</div>
			<div class="form-row">
				<label class="form-label" for="mcp_sortby">{$lang->sort_by}</label>
				<div class="form-field form-inline">
					<select name="filter[sortby]" id="mcp_sortby">
						<option value="username"{$sortbysel['username']}>{$lang->username}</option>
						<option value="issuedby"{$sortbysel['issuedby']}>{$lang->issued_by}</option>
						<option value="dateline"{$sortbysel['dateline']}>{$lang->issued_date}</option>
						<option value="expires"{$sortbysel['expires']}>{$lang->expiry_date}</option>
					</select>
					{$lang->in}
					<select name="filter[order]" aria-label="{$lang->order}">
						<option value="asc"{$ordersel['asc']}>{$lang->asc}</option>
						<option value="desc"{$ordersel['desc']}>{$lang->desc}</option>
					</select>
					{$lang->order}
				</div>
			</div>
			<div class="form-row">
				<label class="form-label" for="mcp_perpage">{$lang->per_page}</label>
				<div class="form-field form-inline"><input type="text" name="filter[per_page]" id="mcp_perpage" value="{$per_page}" class="textbox form-num" /></div>
			</div>
		</div>
		<div class="ucp-actions">
			<input type="submit" class="btn btn-dark btn-sm" value="{$lang->filter_warning_logs}" />
		</div>
	</form>
	<table border="0" cellspacing="0" cellpadding="0" class="tborder ucp-table mcp-logs">
		<tr>
			<td class="thead" colspan="6"><strong>{$lang->warning_logs}</strong></td>
		</tr>
		<tr>
			<td class="tcat">{$lang->warned_user}</td>
			<td class="tcat">{$lang->warning}</td>
			<td class="tcat">{$lang->date_issued}</td>
			<td class="tcat">{$lang->expires}</td>
			<td class="tcat">{$lang->issued_by}</td>
			<td class="tcat ucp-num">{$lang->details}</td>
		</tr>
		{$warning_list}
	</table>
	{$multipage}
</td>
</tr>
</table>
{$footer}
<link rel="stylesheet" href="{$mybb->asset_url}/jscripts/select2/select2.css?ver=1807">
<script type="text/javascript" src="{$mybb->asset_url}/jscripts/select2/select2.min.js?ver=1806"></script>

</body>
</html>
