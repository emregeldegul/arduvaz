<html xml:lang="{$lang->settings['htmllang']}" lang="{$lang->settings['htmllang']}" xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>{$mybb->settings['bbname']} - {$lang->ban_user}</title>
{$headerinclude}
</head>
<body>
{$header}
<table width="100%" border="0" align="center">
<tr>
{$modcp_nav}
<td valign="top">
	{$errors}
	<form action="modcp.php" method="post" class="panel mcp-banuser">
		<input type="hidden" name="action" value="do_banuser" />
		<input type="hidden" name="my_post_key" value="{$mybb->post_code}" />
		<input type="hidden" name="uid" value="{$uid}" />
		<header class="panel-head"><svg><use href="{$theme['imgdir']}/icons.svg#i-ban"/></svg><h1>{$lang->ban_user}</h1>{$lift_link}</header>
		<div class="form-rows">
			{$banuser_username}
			<div class="form-row">
				<label class="form-label" for="banreason">{$lang->ban_reason}</label>
				<div class="form-field"><textarea name="banreason" id="banreason" cols="60" rows="4" maxlength="255">{$banreason}</textarea></div>
			</div>
			{$bangroups}
			<div class="form-row">
				<label class="form-label" for="liftafter">{$lang->ban_liftafter}</label>
				<div class="form-field"><select name="liftafter" id="liftafter" class="select">{$liftlist}</select></div>
			</div>
		</div>
		<div class="ucp-actions">
			<input type="submit" class="btn btn-danger btn-sm" name="updateban" value="{$lang->ban}" />
		</div>
	</form>
</td>
</tr>
</table>
{$footer}

<script type="text/javascript" src="{$mybb->asset_url}/jscripts/select2/select2.min.js?ver=1806"></script>
