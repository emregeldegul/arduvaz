<section class="panel st-poll">
	<header class="panel-head">
		<svg><use href="{$theme['imgdir']}/icons.svg#i-chart"/></svg>
		<h2><span class="poll-label">{$lang->poll}</span> {$poll['question']}</h2>
		<div class="panel-head-links">
			<a href="polls.php?action=showresults&amp;pid={$poll['pid']}">{$lang->show_results}</a>{$edit_poll}
		</div>
	</header>
	<div class="poll-results">
		{$polloptions}
	</div>
	<footer class="poll-foot">
		<span class="poll-total"><strong>{$lang->total}:</strong> {$lang->total_votes}</span>
		<div class="poll-notes">
			<span>{$pollstatus}</span>
			{$undovote}
		</div>
	</footer>
</section>
