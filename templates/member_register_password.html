<div class="rg-row">
	<div class="rg-field">
		<label for="password">{$lang->password}</label>
		<div class="rg-pass">
			<input type="password" class="textbox" name="password" id="password" autocomplete="new-password" data-strength="password_meter" />
			<!-- TODO:lang -->
			<button type="button" class="rg-eye" data-reveal="password" aria-label="Show password" aria-pressed="false"><svg><use href="{$theme['imgdir']}/icons.svg#i-eye"/></svg></button>
		</div>
		<div class="rg-meter" id="password_meter" data-level="0" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
	</div>
	<div class="rg-field">
		<label for="password2">{$lang->confirm_password}</label>
		<div class="rg-pass">
			<input type="password" class="textbox" name="password2" id="password2" autocomplete="new-password" />
			<!-- TODO:lang -->
			<button type="button" class="rg-eye" data-reveal="password2" aria-label="Show password" aria-pressed="false"><svg><use href="{$theme['imgdir']}/icons.svg#i-eye"/></svg></button>
		</div>
	</div>
</div>
<div class="rg-status" id="password_status" style="display: none;">&nbsp;</div>
