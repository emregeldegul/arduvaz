<html xml:lang="{$lang->settings['htmllang']}" lang="{$lang->settings['htmllang']}" xmlns="http://www.w3.org/1999/xhtml">
<head>
	<title>{$mybb->settings['bbname']} - {$lang->coppa_compliance}</title>
	<meta charset="UTF-8" />
	<!-- Yazdırılacak bağımsız form: tema stil dosyaları yüklenmez -->
	<style type="text/css">
		body { max-width: 760px; margin: 40px auto; padding: 0 24px; font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; line-height: 1.6; color: #1e293b; }
		header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 16px; border-bottom: 2px solid #1e293b; }
		header .logo { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; background: #1e293b; color: #fff; }
		header .logo svg { width: 24px; height: 24px; }
		header div { text-align: right; font-size: 16px; font-weight: 700; }
		header span { display: block; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #64748b; }
		h1 { margin: 32px 0 12px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #475569; }
		dl { display: grid; grid-template-columns: 170px 1fr; gap: 14px 16px; margin: 0; }
		dt { padding-top: 6px; font-weight: 600; }
		dd { margin: 0; }
		dd.single { grid-column: 1 / -1; color: #475569; }
		input.textbox { width: 100%; padding: 4px 0; border: 0; border-bottom: 1px solid #1e293b; font: inherit; font-size: 15px; background: none; }
		input.date { width: 120px; }
		.sign { display: flex; align-items: flex-end; gap: 12px; }
		@media print { body { margin: 0; } }
	</style>
</head>
<body>
	<header>
		<a href="index.php" class="logo" aria-label="{$mybb->settings['bbname']}"><svg><use href="{$theme['imgdir']}/icons.svg#i-logo"/></svg></a>
		<div>{$mybb->settings['bbname']}<span>{$lang->coppa_registration}</span></div>
	</header>

	<p>{$lang->coppa_form_instructions}</p>

	<dl>
		<dt>{$lang->fax_number}</dt>
		<dd>{$mybb->settings['faxno']}</dd>
		<dt>{$lang->mailing_address}</dt>
		<dd>{$mybb->settings['mailingaddress']}</dd>
	</dl>

	<h1>{$lang->account_information}</h1>
	<dl>
		<dt><label for="username">{$lang->username}</label></dt>
		<dd><input type="text" class="textbox" id="username" /></dd>
		<dt><label for="email">{$lang->email}</label></dt>
		<dd><input type="text" class="textbox" id="email" /></dd>
	</dl>

	<h1>{$lang->parent_details}</h1>
	<dl>
		<dt><label for="name">{$lang->full_name}</label></dt>
		<dd><input type="text" class="textbox" id="name" /></dd>
		<dt><label for="relation">{$lang->relation}</label></dt>
		<dd><input type="text" class="textbox" id="relation" /></dd>
		<dt><label for="phone">{$lang->phone_no}</label></dt>
		<dd><input type="text" class="textbox" id="phone" /></dd>
		<dt><label for="parent_email">{$lang->email}</label></dt>
		<dd><input type="text" class="textbox" id="parent_email" /></dd>
		<dd class="single">{$lang->coppa_parent_agreement}</dd>
		<dt><label for="signature">{$lang->signature}</label></dt>
		<dd class="sign"><input type="text" class="textbox" id="signature" /> <label for="date">{$lang->date}:</label> <input type="text" class="textbox date" id="date" /></dd>
	</dl>
</body>
</html>
